# ARIA Mission Control — CI/CD Pipeline
#
# Runs on every push + PR to main / master. Three jobs:
#   1. lint      — ESLint check
#   2. typecheck — TypeScript compiler check (no emit)
#   3. test      — Unit + integration tests (bun test)
#
# All jobs must pass for a PR to merge. Uses Bun runtime.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bunx tsc --noEmit

  test:
    name: Unit + Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun test
        env:
          DATABASE_URL: file:./test.db
          RATE_LIMIT_DISABLED: "false"
          NODE_ENV: test
